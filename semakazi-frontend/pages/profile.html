<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundi profile — SemaKazi</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="container" id="profile-container">
    <p class="muted">Loading profile...</p>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const container = document.getElementById('profile-container');
    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('id');
    const viewer = getCurrentUser();

    function waLink(phone, name) {
      const digits = (phone || '').replace(/[^0-9]/g, '');
      const text = encodeURIComponent(`Hi ${name}, I found your profile on SemaKazi and I'd like to talk about a job.`);
      return `https://wa.me/${digits}?text=${text}`;
    }

    function renderProfile(profile) {
      const avgRating = profile.reviews.length
        ? (profile.reviews.reduce((sum, r) => sum + r.rating, 0) / profile.reviews.length).toFixed(1)
        : null;

      const isOwnProfile = viewer && viewer.id === profile.id;
      const canContact = viewer && !isOwnProfile && profile.role === 'fundi';

      container.innerHTML = `
        <div class="card">
          <h1>${profile.name}</h1>
          <p class="muted">${profile.trade || 'Trade not listed'} — ${profile.location || 'Location not listed'}</p>
          ${avgRating ? `<p class="rating">★ ${avgRating} <span class="muted">(${profile.reviews.length} review${profile.reviews.length === 1 ? '' : 's'})</span></p>` : ''}
          ${profile.bio ? `<p>${profile.bio}</p>` : ''}

          ${profile.phone ? `
            <div style="margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap;">
              <a href="tel:${profile.phone}"><button class="secondary" type="button">Call ${profile.phone}</button></a>
              <a href="${waLink(profile.phone, profile.name)}" target="_blank" rel="noopener"><button type="button">WhatsApp</button></a>
            </div>
          ` : ''}
        </div>

        <div class="card">
          <h2>Skill badges</h2>
          ${profile.badges.length
            ? profile.badges.map(b => `<span class="badge-pill">${b.badge_name} · ${b.endorsement_count}</span>`).join('')
            : `<p class="muted">No badges yet.</p>`
          }
          ${canContact ? `
            <form id="badge-form" style="margin-top:16px;">
              <label for="badge_name">Endorse a skill</label>
              <input type="text" id="badge_name" placeholder="e.g. Wiring Safety" required />
              <button type="submit" class="secondary">Endorse</button>
              <p class="error-message" id="badge-error" style="display:none;"></p>
            </form>
          ` : ''}
        </div>

        <div class="card">
          <h2>Proof of work</h2>
          ${profile.proof_of_work.length
            ? profile.proof_of_work.map(p => `
                <div style="margin-bottom:12px;">
                  <img src="${p.media_url}" alt="${p.caption || 'Proof of work'}" style="max-width:100%; border-radius:8px;" onerror="this.style.display='none'" />
                  ${p.caption ? `<p class="muted">${p.caption}</p>` : ''}
                </div>
              `).join('')
            : `<p class="muted">No proof-of-work uploaded yet.</p>`
          }
        </div>

        ${canContact ? `
          <div class="card">
            <h2>Request this fundi</h2>
            <form id="request-form">
              <label for="req_message">What do you need done?</label>
              <textarea id="req_message" rows="3" required placeholder="Describe the job..."></textarea>

              <label for="req_date">Preferred date (optional)</label>
              <input type="date" id="req_date" />

              <button type="submit">Send request</button>
              <p class="error-message" id="request-error" style="display:none;"></p>
              <p class="muted" id="request-success" style="display:none;">Request sent — ${profile.name} will see it on their dashboard.</p>
            </form>
          </div>
        ` : ''}

        <div class="card">
          <h2>Reviews</h2>
          <div id="reviews-list">
            ${profile.reviews.length
              ? profile.reviews.map(r => `
                  <div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--color-border);">
                    <p class="rating">★ ${r.rating} <strong>${r.reviewer_name}</strong></p>
                    ${r.comment ? `<p>${r.comment}</p>` : ''}
                    ${viewer ? `<button class="secondary" data-flag-id="${r.id}" style="margin-top:4px; font-size:0.75rem; padding:4px 10px;">Report</button>` : ''}
                  </div>
                `).join('')
              : `<p class="muted">No reviews yet. Be the first to leave one.</p>`
            }
          </div>

          <h2>Leave a review</h2>
          ${viewer
            ? (isOwnProfile
                ? `<p class="muted">You can't review your own profile.</p>`
                : `
                  <form id="review-form">
                    <label for="rating">Rating</label>
                    <select id="rating" required>
                      <option value="5">5 - Excellent</option>
                      <option value="4">4 - Good</option>
                      <option value="3">3 - Average</option>
                      <option value="2">2 - Below average</option>
                      <option value="1">1 - Poor</option>
                    </select>

                    <label for="comment">Comment (optional)</label>
                    <textarea id="comment" rows="3"></textarea>

                    <button type="submit">Submit review</button>
                    <p class="error-message" id="review-error" style="display:none;"></p>
                  </form>
                `)
            : `<p class="muted">Please <a href="login.html">log in</a> to leave a review.</p>`
          }
        </div>
      `;

      const reviewForm = document.getElementById('review-form');
      if (reviewForm) {
        reviewForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById('review-error');
          errorEl.style.display = 'none';

          try {
            await api.addReview(profileId, {
              rating: Number(document.getElementById('rating').value),
              comment: document.getElementById('comment').value || undefined
            });
            const updated = await api.getProfile(profileId);
            renderProfile(updated);
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
          }
        });
      }

      const badgeForm = document.getElementById('badge-form');
      if (badgeForm) {
        badgeForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById('badge-error');
          errorEl.style.display = 'none';
          try {
            await api.addBadge(profileId, { badge_name: document.getElementById('badge_name').value });
            const updated = await api.getProfile(profileId);
            renderProfile(updated);
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
          }
        });
      }

      const requestForm = document.getElementById('request-form');
      if (requestForm) {
        requestForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById('request-error');
          const successEl = document.getElementById('request-success');
          errorEl.style.display = 'none';
          successEl.style.display = 'none';
          try {
            await api.sendRequest({
              fundi_id: Number(profileId),
              message: document.getElementById('req_message').value,
              preferred_date: document.getElementById('req_date').value || undefined
            });
            requestForm.reset();
            successEl.style.display = 'block';
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
          }
        });
      }

      document.querySelectorAll('[data-flag-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Report this review for moderator review?')) return;
          try {
            await api.flagReview(btn.dataset.flagId);
            const updated = await api.getProfile(profileId);
            renderProfile(updated);
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    async function loadProfile() {
      if (!profileId) {
        container.innerHTML = `<p class="error-message">No profile specified.</p>`;
        return;
      }
      try {
        const profile = await api.getProfile(profileId);
        renderProfile(profile);
      } catch (err) {
        container.innerHTML = `<p class="error-message">${err.message}</p>`;
      }
    }

    loadProfile();
  </script>
</body>
</html>
