<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SemaKazi</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="container" id="dashboard-container">
    <p class="muted">Loading dashboard...</p>
  </div>

  <script src="../js/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const container = document.getElementById('dashboard-container');
    const user = getCurrentUser();

    // Protected route — bounce to login if there's no session
    if (!user || !getToken()) {
      window.location.href = 'login.html';
    }

    // Fundis and clients use SemaKazi for opposite things — fundis show
    // their work and answer requests, clients find and hire fundis — so
    // each role gets its own dashboard.
    function renderDashboard(profile) {
      if (profile.role === 'fundi') {
        renderFundiDashboard(profile);
      } else {
        renderClientDashboard(profile);
      }
    }

    function renderFundiDashboard(profile) {
      container.innerHTML = `
        <div class="card">
          <p class="muted">Fundi account</p>
          <h1>Welcome, ${escapeHtml(profile.name)}</h1>
          <p class="muted">
            <a href="profile.html?id=${encodeURIComponent(profile.id)}">View your public profile</a>
          </p>
        </div>

        <div class="card">
          <h2>Incoming requests</h2>
          <div id="requests-list">
            <p class="muted">Loading...</p>
          </div>
        </div>

        <div class="card">
          <h2>Edit profile</h2>
          <form id="edit-form">
            <label for="trade">Trade</label>
            <input type="text" id="trade" value="${escapeHtml(profile.trade)}" />

            <label for="location">Location</label>
            <input type="text" id="location" value="${escapeHtml(profile.location)}" />

            <label for="bio">Bio</label>
            <textarea id="bio" rows="3">${escapeHtml(profile.bio)}</textarea>

            <label for="phone">Phone</label>
            <input type="text" id="phone" value="${escapeHtml(profile.phone)}" />

            <button type="submit">Save changes</button>
            <p class="error-message" id="edit-error" style="display:none;"></p>
          </form>
        </div>

        <div class="card">
          <h2>Add proof of work</h2>
          <form id="pow-form">
            <label for="media_url">Image/video URL</label>
            <input type="url" id="media_url" placeholder="https://..." required />

            <label for="caption">Caption</label>
            <input type="text" id="caption" placeholder="e.g. Rewired a 3-bedroom house" />

            <button type="submit">Add entry</button>
            <p class="error-message" id="pow-error" style="display:none;"></p>
          </form>

          <h2 style="margin-top:24px;">Your proof of work</h2>
          <div id="pow-list">
            ${profile.proof_of_work.length
              ? profile.proof_of_work.map(p => `
                  <div class="card" style="margin-bottom:8px;">
                    <p>${escapeHtml(p.caption || '(no caption)')}</p>
                    <p class="muted" style="word-break:break-all;">${escapeHtml(p.media_url)}</p>
                    <button class="secondary" data-delete-id="${escapeHtml(p.id)}">Remove</button>
                  </div>
                `).join('')
              : `<p class="muted">You haven't added any proof-of-work yet.</p>`
            }
          </div>
        </div>

        <div class="card">
          <h2>Your stats</h2>
          <p><strong>${profile.reviews.length}</strong> review${profile.reviews.length === 1 ? '' : 's'}</p>
          <p><strong>${profile.badges.length}</strong> skill badge${profile.badges.length === 1 ? '' : 's'}</p>
        </div>
      `;

      loadIncomingRequests();

      bindEditForm(profile, () => ({
        trade: document.getElementById('trade').value,
        location: document.getElementById('location').value,
        bio: document.getElementById('bio').value,
        phone: document.getElementById('phone').value
      }));

      document.getElementById('pow-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('pow-error');
        errorEl.style.display = 'none';
        try {
          await api.addProofOfWork({
            media_url: document.getElementById('media_url').value,
            caption: document.getElementById('caption').value || undefined
          });
          refresh();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
        }
      });

      document.querySelectorAll('[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await api.deleteProofOfWork(btn.dataset.deleteId);
            refresh();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    function renderClientDashboard(profile) {
      container.innerHTML = `
        <div class="card">
          <p class="muted">Client account</p>
          <h1>Welcome, ${escapeHtml(profile.name)}</h1>
          <p>Find a verified fundi, check their reviews and proof of work, then send them a job request.</p>
          <a href="search.html"><button type="button">Find a fundi</button></a>
        </div>

        <div class="card">
          <h2>Your job requests</h2>
          <div id="requests-list">
            <p class="muted">Loading...</p>
          </div>
        </div>

        <div class="card">
          <h2>Your details</h2>
          <p class="muted">Fundis you send a request to see your name and phone number, so they can reach you.</p>
          <form id="edit-form">
            <label for="location">Location</label>
            <input type="text" id="location" value="${escapeHtml(profile.location)}" />

            <label for="phone">Phone</label>
            <input type="text" id="phone" value="${escapeHtml(profile.phone)}" />

            <button type="submit">Save changes</button>
            <p class="error-message" id="edit-error" style="display:none;"></p>
          </form>
        </div>
      `;

      loadOutgoingRequests();

      bindEditForm(profile, () => ({
        location: document.getElementById('location').value,
        phone: document.getElementById('phone').value
      }));
    }

    function bindEditForm(profile, readFields) {
      document.getElementById('edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('edit-error');
        errorEl.style.display = 'none';
        try {
          await api.updateProfile(profile.id, readFields());
          refresh();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
        }
      });
    }

    async function loadIncomingRequests() {
      const listEl = document.getElementById('requests-list');
      try {
        const requests = await api.getIncomingRequests();
        if (requests.length === 0) {
          listEl.innerHTML = `<p class="muted">No requests yet. Clients who find your profile can send you one.</p>`;
          return;
        }
        listEl.innerHTML = requests.map(r => `
          <div class="card" style="margin-bottom:8px;">
            <p><strong>${escapeHtml(r.client_name)}</strong> <span class="muted">(${escapeHtml(r.client_phone || 'no phone listed')})</span></p>
            <p>${escapeHtml(r.message)}</p>
            ${r.preferred_date ? `<p class="muted">Preferred date: ${escapeHtml(r.preferred_date)}</p>` : ''}
            <p class="rating" style="text-transform:uppercase;">${escapeHtml(r.status)}</p>
            ${r.status === 'pending' ? `
              <div style="display:flex; gap:8px;">
                <button data-request-id="${escapeHtml(r.id)}" data-status="accepted">Accept</button>
                <button class="secondary" data-request-id="${escapeHtml(r.id)}" data-status="declined">Decline</button>
              </div>
            ` : ''}
          </div>
        `).join('');

        document.querySelectorAll('[data-request-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              await api.updateRequestStatus(btn.dataset.requestId, btn.dataset.status);
              loadIncomingRequests();
            } catch (err) {
              alert(err.message);
            }
          });
        });
      } catch (err) {
        renderError(listEl, err.message);
      }
    }

    async function loadOutgoingRequests() {
      const listEl = document.getElementById('requests-list');
      try {
        const requests = await api.getOutgoingRequests();
        if (requests.length === 0) {
          listEl.innerHTML = `<p class="muted">You haven't sent any requests yet. <a href="search.html">Find a fundi</a> to get started.</p>`;
          return;
        }
        listEl.innerHTML = requests.map(r => `
          <div class="card" style="margin-bottom:8px;">
            <p>
              <strong><a href="profile.html?id=${encodeURIComponent(r.fundi_id)}">${escapeHtml(r.fundi_name)}</a></strong>
              <span class="muted">${escapeHtml(r.fundi_trade || '')}</span>
            </p>
            <p>${escapeHtml(r.message)}</p>
            ${r.preferred_date ? `<p class="muted">Preferred date: ${escapeHtml(r.preferred_date)}</p>` : ''}
            <p class="rating" style="text-transform:uppercase;">${escapeHtml(r.status)}</p>
            ${r.status === 'accepted' && r.fundi_phone ? `
              <p>Accepted. Call <a href="tel:${escapeHtml(phoneDigits(r.fundi_phone))}">${escapeHtml(r.fundi_phone)}</a> to arrange the job.</p>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        renderError(listEl, err.message);
      }
    }

    async function refresh() {
      try {
        const profile = await api.getProfile(user.id);
        renderDashboard(profile);
      } catch (err) {
        renderError(container, err.message);
      }
    }

    refresh();
  </script>
</body>
</html>
