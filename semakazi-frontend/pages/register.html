<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — SemaKazi</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="container">
    <div class="card">
      <h1>Create your account</h1>

      <form id="register-form">
        <label for="role">I am a...</label>
        <select id="role" required>
          <option value="fundi">Fundi (skilled worker)</option>
          <option value="client">Client (looking to hire)</option>
        </select>

        <label for="name">Full name</label>
        <input type="text" id="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" />

        <div id="fundi-fields">
          <label for="trade">Trade</label>
          <input type="text" id="trade" placeholder="e.g. Electrician" />

          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g. Nairobi - Kawangware" />
        </div>

        <button type="submit">Sign up</button>
        <p class="error-message" id="error" style="display:none;"></p>
      </form>

      <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const roleSelect = document.getElementById('role');
    const fundiFields = document.getElementById('fundi-fields');
    const errorEl = document.getElementById('error');

    roleSelect.addEventListener('change', () => {
      fundiFields.style.display = roleSelect.value === 'fundi' ? 'block' : 'none';
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const payload = {
        role: roleSelect.value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        trade: document.getElementById('trade').value || undefined,
        location: document.getElementById('location').value || undefined
      };

      try {
        const { user, token } = await api.register(payload);
        setToken(token);
        setCurrentUser(user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
